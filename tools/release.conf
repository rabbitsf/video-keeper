# Release settings shared by the build scripts (single source).
# GITHUB_REPO hosts the helper releases: the installer download page and the self-update files
# (helper-update.json + video-keeper-helper-<release>.zip). Set it when the public repo exists;
# the extension's download link (src/lib/links.js) must point at the same repo.
GITHUB_REPO="rabbitsf/video-keeper"
# Apple Developer Team ID: helper updates are only accepted if every program in them is signed by
# this team and notarized by Apple.
TEAM_ID="G2GFX9GQZ6"
